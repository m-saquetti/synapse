name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Electron and electron-builder are only needed to package the Windows installer.
      - run: npm ci --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm test
